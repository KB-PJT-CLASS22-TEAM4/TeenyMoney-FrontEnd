name: Deploy development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-development
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://www.teenymoney.kro.kr

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_PORT: ${{ vars.EC2_PORT }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 빌드
        shell: bash
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -Eeuo pipefail

          test -n "$VITE_API_BASE_URL"
          npm ci
          npm run build

      - name: 빌드 산출물 검증
        id: artifact
        shell: bash
        working-directory: frontend
        env:
          FRONTEND_ARCHIVE: ${{ runner.temp }}/teenymoney-frontend.tar.gz
        run: |
          set -Eeuo pipefail

          test -s dist/index.html
          test -d dist/assets

          tar -czf "$FRONTEND_ARCHIVE" -C dist .
          tar -tzf "$FRONTEND_ARCHIVE" >/dev/null

          archive_sha256="$(sha256sum "$FRONTEND_ARCHIVE" | awk '{print $1}')"
          echo "sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: SSH 설정
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$EC2_KNOWN_HOSTS"
          test -n "$EC2_HOST"
          test -n "$EC2_PORT"
          test -n "$EC2_USER"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 러너 IP 임시 허용
        id: sg
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$EC2_SECURITY_GROUP_ID"

          runner_ip="$(curl -fsS --max-time 5 https://checkip.amazonaws.com)"

          rule_id="$(
            aws ec2 authorize-security-group-ingress \
              --group-id "$EC2_SECURITY_GROUP_ID" \
              --ip-permissions "IpProtocol=tcp,FromPort=$EC2_PORT,ToPort=$EC2_PORT,IpRanges=[{CidrIp=$runner_ip/32,Description=gha-fe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}]" \
              --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
              --output text
          )"

          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"
          echo "러너 IP $runner_ip/32 를 $EC2_PORT 번 포트에 허용했습니다. (rule: $rule_id)"

      - name: SSH 연결 준비 확인
        shell: bash
        run: |
          set -Eeuo pipefail
      
          runner_ip="$(curl -fsS --max-time 5 https://checkip.amazonaws.com)"
      
          echo "Runner IP: ${runner_ip}"
          echo "EC2 HOST: ${EC2_HOST}"
          echo "EC2 PORT: ${EC2_PORT}"
          echo "Security Group: ${EC2_SECURITY_GROUP_ID}"
          echo "Rule ID: ${{ steps.sg.outputs.rule_id }}"
      
          echo "=== 등록된 Security Group Rule 확인 ==="
      
          aws ec2 describe-security-group-rules \
            --security-group-rule-ids "${{ steps.sg.outputs.rule_id }}" \
            --query 'SecurityGroupRules[0].{RuleId:SecurityGroupRuleId,CIDR:CidrIpv4,FromPort:FromPort,ToPort:ToPort}' \
            --output table
      
          echo "=== EC2 SSH 포트 연결 대기 ==="
      
          for attempt in $(seq 1 10); do
            if timeout 3 bash -c \
              "cat < /dev/null > /dev/tcp/${EC2_HOST}/${EC2_PORT}" 2>/dev/null; then
              echo "SSH TCP 연결 확인 완료"
              exit 0
            fi
      
            echo "SSH 포트 연결 대기 중... (${attempt}/10)"
            sleep 3
          done
      
          echo "30초 동안 EC2 SSH 포트에 연결할 수 없었습니다."
          exit 1


      - name: EC2 배포
        shell: bash
        env:
          ARCHIVE_SHA256: ${{ steps.artifact.outputs.sha256 }}
          FRONTEND_ARCHIVE: ${{ runner.temp }}/teenymoney-frontend.tar.gz
        run: |
          set -Eeuo pipefail

          ssh_options=(
            -i "$HOME/.ssh/deploy_key"
            -p "$EC2_PORT"
            -o ConnectTimeout=10
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
          )

          remote_dir="/home/$EC2_USER/.teenymoney-deploy/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote_archive="$remote_dir/frontend-$GITHUB_SHA.tar.gz"

          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" \
            "install -d -m 700 '$remote_dir'"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -P "$EC2_PORT" \
            -o ConnectTimeout=10 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            "$FRONTEND_ARCHIVE" \
            "$EC2_USER@$EC2_HOST:$remote_archive"

          ssh "${ssh_options[@]}" "$EC2_USER@$EC2_HOST" \
            "sudo bash -s -- '$remote_archive' '$GITHUB_SHA' '$ARCHIVE_SHA256' '$GITHUB_RUN_ID' '$GITHUB_RUN_ATTEMPT'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          incoming_archive="$1"
          deploy_sha="$2"
          expected_sha256="$3"
          run_id="$4"
          run_attempt="$5"

          readonly live_dir='/var/www/teenymoney'
          readonly backup_dir='/var/backups/teenymoney'
          readonly public_url='https://www.teenymoney.kro.kr/'

          log() {
            printf '[%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$*"
          }

          check_public_site() {
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 3 \
              --max-time 10 \
              --header 'Cache-Control: no-cache' \
              "${public_url}?deployment=${deploy_sha}" >/dev/null
          }

          prune_backups() {
            local preserve_backup="${1:-}"
            local retention_limit="${2:-5}"
            local keep_slots="$retention_limit"
            local kept=0
            local backup_list
            local backup_archive
            local -a all_backups

            [[ "$retention_limit" =~ ^[1-9][0-9]*$ ]] || return 1

            if [[ -n "$preserve_backup" && -f "$preserve_backup" ]]; then
              keep_slots=$((retention_limit - 1))
            fi

            backup_list="$(
              find "$backup_dir" -maxdepth 1 -type f -name 'frontend-*.tar.gz' -printf '%T@ %p\n' |
                sort -rn |
                awk '{ sub(/^[^ ]+ /, ""); print }'
            )" || return 1

            if [[ -n "$backup_list" ]]; then
              mapfile -t all_backups <<< "$backup_list"
            else
              all_backups=()
            fi

            for backup_archive in "${all_backups[@]}"; do
              if [[ "$backup_archive" == "$preserve_backup" ]]; then
                continue
              fi

              if (( kept < keep_slots )); then
                kept=$((kept + 1))
                continue
              fi

              rm -f -- "$backup_archive" "$backup_archive.sha256" || return 1
            done
          }

          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]] || {
            log '잘못된 Git SHA입니다.'
            exit 64
          }
          [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            log '잘못된 SHA-256 값입니다.'
            exit 64
          }
          [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[0-9]+$ ]] || {
            log '잘못된 GitHub Actions 실행 식별자입니다.'
            exit 64
          }

          staging_dir="/var/www/.teenymoney-next-$run_id-$run_attempt"
          previous_dir="/var/www/.teenymoney-previous-$run_id-$run_attempt"
          backup_archive=''
          backup_archive_tmp=''
          backup_checksum_tmp=''
          backup_published=false
          has_previous=false
          live_displaced=false
          new_live_installed=false
          deploy_verified=false
          preserve_previous=false

          restore_previous_version() {
            if [[ "$new_live_installed" == true ]]; then
              rm -rf -- "$live_dir" || return 1
              [[ ! -e "$live_dir" && ! -L "$live_dir" ]] || return 1
              new_live_installed=false
            fi

            if [[ "$has_previous" != true ]]; then
              log '복원할 이전 프론트엔드 디렉터리가 없습니다.'
              return 1
            fi

            [[ -d "$previous_dir" && ! -L "$previous_dir" ]] || return 1
            mv -T -- "$previous_dir" "$live_dir" || return 1
            live_displaced=false

            nginx -t || return 1
            systemctl reload nginx || return 1
            check_public_site || return 1
          }

          finish_deployment() {
            local exit_status="$?"

            trap - EXIT HUP INT TERM
            set +e
            set +u
            set +o pipefail

            if (( exit_status != 0 )) &&
               [[ "$deploy_verified" != true ]] &&
               { [[ "$new_live_installed" == true ]] ||
                 [[ "$live_displaced" == true ]] ||
                 [[ -d "$previous_dir" && ! -L "$previous_dir" ]]; }; then
              log '비정상 종료를 감지하여 이전 프론트엔드 복원을 시도합니다.'

              if restore_previous_version; then
                log "이전 프론트엔드 자동 복원 성공: $backup_archive"
              else
                if [[ -d "$previous_dir" && ! -L "$previous_dir" ]]; then
                  preserve_previous=true
                fi

                log "이전 프론트엔드 자동 복원 실패: $previous_dir"
                journalctl -u nginx -n 120 --no-pager || true
              fi
            fi

            rm -rf -- "$staging_dir" || true
            [[ -z "$backup_archive_tmp" ]] || rm -f -- "$backup_archive_tmp" || true
            [[ -z "$backup_checksum_tmp" ]] || rm -f -- "$backup_checksum_tmp" || true

            if [[ "$backup_published" != true && -n "$backup_archive" ]]; then
              rm -f -- "$backup_archive" "$backup_archive.sha256" || true
            fi

            if [[ -d "$previous_dir" ]] &&
               [[ "$preserve_previous" == true || "$live_displaced" == true ]]; then
              log "복구용 이전 디렉터리를 보존합니다: $previous_dir"
            else
              rm -rf -- "$previous_dir" || true
            fi

            if [[ -d "$backup_dir" ]]; then
              if [[ -n "$backup_archive" && -f "$backup_archive" ]]; then
                prune_backups "$backup_archive" || log '오래된 프론트엔드 백업 정리에 실패했습니다.'
              else
                prune_backups '' || log '오래된 프론트엔드 백업 정리에 실패했습니다.'
              fi
            fi

            rm -f -- "$incoming_archive" || true
            rmdir -- "$(dirname -- "$incoming_archive")" 2>/dev/null || true

            exit "$exit_status"
          }

          trap finish_deployment EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          [[ -f "$incoming_archive" && ! -L "$incoming_archive" ]] || {
            log '배포 압축파일이 없거나 심볼릭 링크입니다.'
            exit 66
          }
          [[ "$(basename -- "$incoming_archive")" == "frontend-$deploy_sha.tar.gz" ]] || {
            log '압축파일명과 Git SHA가 일치하지 않습니다.'
            exit 65
          }
          [[ "$(sha256sum "$incoming_archive" | awk '{print $1}')" == "$expected_sha256" ]] || {
            log '전송된 압축파일의 SHA-256 값이 일치하지 않습니다.'
            exit 65
          }
          tar -tzf "$incoming_archive" >/dev/null || {
            log '전송된 압축파일을 읽을 수 없습니다.'
            exit 65
          }

          rm -rf -- "$staging_dir" "$previous_dir"
          install -d -o root -g root -m 0755 "$staging_dir"
          tar \
            --extract \
            --gzip \
            --file "$incoming_archive" \
            --directory "$staging_dir" \
            --no-same-owner \
            --no-same-permissions

          [[ -s "$staging_dir/index.html" ]] || {
            log 'staging 디렉터리에 index.html이 없습니다.'
            exit 65
          }
          [[ -z "$(find "$staging_dir" -type l -print -quit)" ]] || {
            log 'staging 디렉터리에 허용되지 않은 심볼릭 링크가 있습니다.'
            exit 65
          }

          chown -R www-data:www-data "$staging_dir"
          find "$staging_dir" -type d -exec chmod 0755 {} +
          find "$staging_dir" -type f -exec chmod 0644 {} +

          install -d -o root -g root -m 0750 "$backup_dir"
          timestamp="$(date '+%Y%m%d-%H%M%S')"
          backup_archive="$backup_dir/frontend-$timestamp-${deploy_sha:0:12}-$run_id-$run_attempt.tar.gz"
          backup_archive_tmp="$backup_dir/.frontend-$run_id-$run_attempt.tar.gz.tmp"
          backup_checksum_tmp="$backup_dir/.frontend-$run_id-$run_attempt.sha256.tmp"

          if [[ -d "$live_dir" && ! -L "$live_dir" ]]; then
            prune_backups '' 4

            tar -czf "$backup_archive_tmp" -C "$live_dir" .
            tar -tzf "$backup_archive_tmp" >/dev/null
            backup_sha256="$(sha256sum "$backup_archive_tmp" | awk '{print $1}')"
            printf '%s  %s\n' \
              "$backup_sha256" \
              "$(basename -- "$backup_archive")" > "$backup_checksum_tmp"

            mv -- "$backup_archive_tmp" "$backup_archive"
            backup_archive_tmp=''

            if mv -- "$backup_checksum_tmp" "$backup_archive.sha256"; then
              backup_checksum_tmp=''
              backup_published=true
            else
              rm -f -- "$backup_archive" "$backup_checksum_tmp" || true
              backup_checksum_tmp=''
              log '프론트엔드 백업 체크섬 게시에 실패했습니다.'
              exit 74
            fi

            has_previous=true
            live_displaced=true

            if ! mv -T -- "$live_dir" "$previous_dir"; then
              log '기존 운영 디렉터리를 복구 위치로 이동하지 못했습니다.'
              exit 73
            fi

            log "기존 프론트엔드 백업 완료: $backup_archive"
          elif [[ -e "$live_dir" || -L "$live_dir" ]]; then
            log '운영 경로가 일반 디렉터리가 아닙니다.'
            exit 65
          fi

          new_live_installed=true

          if ! mv -T -- "$staging_dir" "$live_dir"; then
            log 'staging 디렉터리를 운영 경로로 전환하지 못했습니다.'
            exit 73
          fi

          nginx -t
          systemctl reload nginx
          check_public_site
          deploy_verified=true

          rm -rf -- "$previous_dir" || log '이전 프론트엔드 임시 디렉터리 정리에 실패했습니다.'
          live_displaced=false
          prune_backups '' || log '오래된 프론트엔드 백업 정리에 실패했습니다.'
          log "프론트엔드 배포 성공: $deploy_sha"
          exit 0
          REMOTE_SCRIPT

      - name: SSH 및 임시 파일 정리
        if: always()
        shell: bash
        env:
          FRONTEND_ARCHIVE: ${{ runner.temp }}/teenymoney-frontend.tar.gz
        run: |
          set +e

          if [[ -f "$HOME/.ssh/deploy_key" && -f "$HOME/.ssh/known_hosts" ]]; then
            remote_dir="/home/$EC2_USER/.teenymoney-deploy/incoming/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$EC2_PORT" \
              -o ConnectTimeout=10 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" \
              "$EC2_USER@$EC2_HOST" \
              "rm -f -- '$remote_dir/frontend-$GITHUB_SHA.tar.gz'; rmdir -- '$remote_dir' 2>/dev/null || true"
          fi

          rm -f -- "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts" "$FRONTEND_ARCHIVE"

      - name: 러너 IP 허용 회수
        if: always() && steps.sg.outputs.rule_id != ''
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --security-group-rule-ids '${{ steps.sg.outputs.rule_id }}'

      - name: 배포 결과 요약
        if: always()
        shell: bash
        run: |
          {
            echo '## Frontend development deployment'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo '- Environment: `development`'
            echo "- Result: \`${{ job.status }}\`"
            echo '- URL: https://www.teenymoney.kro.kr'
          } >> "$GITHUB_STEP_SUMMARY"
